name: ci-worker
on: workflow_dispatch
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Write MCP config (the link stays a secret)
        env:
          MCP_URL: ${{ secrets.MCP_URL }}
        run: |
          node -e 'require("fs").writeFileSync("mcp.json", JSON.stringify({mcpServers:{worker:{type:"http",url:process.env.MCP_URL}}}))'
      - name: Run worker
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat BRIEF.md)" --mcp-config mcp.json --strict-mcp-config \
            --allowedTools "mcp__worker" "Read" "Write" "ListMcpResourcesTool" "ReadMcpResourceTool" "Bash(hostname)" \
            --output-format stream-json --verbose > worker.jsonl 2> worker.err || echo "claude exit $?"
          rm -f mcp.json
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: |
            RESULT.json
            NOTE.md
            worker.jsonl
            worker.err
          retention-days: 1
